name: PaseListo - paquete portable DEMO (sin desplegar)
on:
  pull_request:
    paths:
      - 'scripts/build-hosting-demo.mjs'
      - 'tests/hosting-package.test.mjs'
      - '.github/workflows/hosting-demo-package.yml'
      - 'vercel.json'
      - 'src/**'
      - 'assets/**'
      - 'data/**'
      - '*.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and packaging
        run: |
          node --check scripts/build-hosting-demo.mjs
          node --test tests/hosting-package.test.mjs
      - name: Produce portable demo
        run: node scripts/build-hosting-demo.mjs
      - name: Upload files for hosting (static demo only)
        uses: actions/upload-artifact@v4
        with:
          name: paselisto-demo-hosting
          path: dist/
          include-hidden-files: true
          retention-days: 14
