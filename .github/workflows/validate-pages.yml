name: Validar cartelera pública PaseListo
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser modules parse correctly
        run: |
          node --check src/marketplace.mjs
          node --check src/hero-carousel.mjs
          node --check src/commerce-domain.mjs
          node --check src/event-page.mjs
          node --check src/reference-checkout.mjs
          node --check src/week-events.mjs
          node --check src/venue-zones.mjs
          node --check src/event-page-domain.mjs
          node --check src/venue-geolocation.mjs
          node --check src/control.mjs
      - name: Regression test on broken third-party posters
        run: node --test tests/poster-resilience.test.mjs
      - name: Verify event cards and catalogs
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const script=readFileSync('src/marketplace.mjs','utf8');
          const demo=JSON.parse(readFileSync('data/eventos-clientes-demo.json','utf8'));
          const refs=JSON.parse(readFileSync('data/eventos-reales-referencia.json','utf8'));
          assert.ok(demo.events.length >= 8, 'Missing demo events');
          assert.ok(refs.events.length >= 6, 'Missing reference events');
          assert.match(script, /function realCard\(event\)/);
          assert.match(script, /function card\(event\)/);
          assert.ok(script.includes("realPoster(event)+'</div>'"));
          assert.ok(script.includes("poster(event)+'</div>'"));
          assert.ok(!script.includes('poster-arrow'));
          assert.ok(!script.includes('Ver fuente oficial de la fecha y recinto'));
          assert.ok(script.includes('eventDetailHref('));
          const details=readFileSync('evento.html','utf8');
          const detailJs=readFileSync('src/event-page.mjs','utf8');
          const zones=readFileSync('src/venue-zones.mjs','utf8');
          assert.ok(details.includes('id="venue-zone-map"'), 'Zone map container missing');
          assert.ok(details.includes('id="venue-zone-legend"'), 'Zone legend missing');
          assert.ok(detailJs.includes('renderVenueMap(event,store,reference,inventory)'), 'Zone map not rendered');
          assert.ok(detailJs.includes('data-ticket-zone'), 'Map not linked to ticket prices');
          assert.ok(detailJs.includes('PLANO 100 % FICTICIO'), 'Mock venue sectors must be disclosed');
          assert.ok(detailJs.includes('changeDemoTier?.(target.dataset.zoneSelect)'), 'Mock zone selector must update ticket selection');
          assert.ok(details.includes('id="reference-checkout"'), 'Integrated checkout step missing');
          assert.ok(details.includes('id="reference-checkout-confirm"'), 'Demo confirmation step missing');
          assert.ok(detailJs.includes('renderReferenceCheckout(event)'), 'Real reference checkout not enabled');
          assert.ok(detailJs.includes('referenceOrderReceipt(quote,crypto.randomUUID())'), 'Demo receipt generation missing');
          assert.ok(!page.includes('lab-testing')&&!script.includes('setupPurchaseLab()'), 'Separate buying lab must be removed');
          const {hasHeroPoster,hasEventDescription}=await import('./src/hero-carousel.mjs');
          const photographed=refs.events.filter(e=>hasHeroPoster(e,'reference')&&hasEventDescription(e));
          assert.equal(photographed.length,6,'Only complete photo+description examples should be visible');
          assert.ok(script.includes('hasEventDescription(e)'), 'Public references need descriptions');
          const {referenceQuote,referenceOrderReceipt}=await import('./src/reference-checkout.mjs');
          const quoteDemo=referenceQuote({id:'ref-camila-2026'},'general',2);
          assert.equal(quoteDemo.totalClp,44000,'Demo subtotal and fee miscalculated');
          const receiptDemo=referenceOrderReceipt(quoteDemo,'12345678-abcdef');
          assert.equal(receiptDemo.paymentProcessed,false,'Demo must never process real payments');
          assert.equal(receiptDemo.ticketIssued,false,'Demo must never issue valid tickets');
          assert.ok(detailJs.includes('SIN PLANO VERIFICADO'), 'Unverified venue warning missing');
          assert.ok(zones.includes('ZONE_COLORS'), 'Category color palette missing');
          const eventPage=readFileSync('evento.html','utf8');
          const page=readFileSync('index.html','utf8');
          const carouselCss=readFileSync('src/hero-carousel.css','utf8');
          const carousel=readFileSync('src/hero-carousel.mjs','utf8');
          assert.ok(page.includes('id="hero-carousel-controls"'), 'Main hero carousel controls missing');
          assert.ok(page.includes('id="hero-carousel-dots"'), 'Hero slide indicators missing');
          assert.ok(page.includes('id="hero-feature-link"'), 'Hero CTA missing');
          assert.ok(page.includes('id="hero-poster"'), 'Hero poster missing');
          assert.ok(!page.includes('id="hero-slide-count"'), 'Old numeric hero counter must be removed');
          assert.ok(!page.includes('data-hero-step'), 'Old hero arrow buttons must be removed');
          assert.ok(!page.includes('data-hero-toggle'), 'Old hero pause button must be removed');
          assert.ok(carouselCss.includes('height:clamp(310px,44svh,345px)'), 'Half-height mobile hero missing');
          assert.ok(carouselCss.includes('object-fit:cover'), 'Hero background must fill the entire banner');
          assert.ok(carouselCss.includes('.hero-carousel .hero-poster-bottom{display:none}'), 'Poster caption overlay should be hidden');
          assert.ok(script.includes('"touchstart"')&&script.includes('"touchend"'), 'Mobile swipe navigation missing');
          assert.ok(script.includes('"pointerdown"')&&script.includes('"pointerup"'), 'Desktop drag missing');
          assert.ok(script.includes('Math.abs(dy)*1.3'), 'Swipe must not intercept vertical scroll');
          assert.ok(script.includes('stopImmediatePropagation'), 'Swipe must not trigger a link click');
          assert.ok(!script.includes('#hero-slide-count'), 'Old counter still updated from JavaScript');
          assert.ok(!script.includes('[data-hero-toggle]'), 'Old pause UI still wired');
          assert.ok(page.includes('id="real-events-grid"'), 'Real event grid missing');
          assert.ok(page.includes('id="events-grid" hidden aria-hidden="true"'), 'DEMO purchase grid must remain hidden');
          assert.ok(!page.includes('Compra de demostración'), 'DEMO purchase section must not appear');
          assert.ok(page.includes('Eventos reales'), 'Real reference heading missing');
          assert.ok(script.includes('function allCatalogEvents(){return realEvents();}'), 'Filters must include real events only');
          assert.ok(script.includes('$("#events-grid").replaceChildren()'), 'DEMO cards must never be rendered');
          assert.ok(script.includes('const real=realEvents().filter(matches)'), 'Cards must be real events only');
          assert.ok(!page.includes('id="week-strip"'), 'Incorrect weekly header strip still present');
          assert.ok(!eventPage.includes('id="week-strip"'), 'Incorrect event-page header strip still present');
          assert.ok(carouselCss.includes('.hero-carousel-dot.is-active'), 'Interactive carousel styling missing');
          assert.ok(script.includes('selectHeroEvents(realSamples,[],current(),6)'), 'Hero must contain real reference events only');
          assert.ok(script.includes('window.setInterval('), 'Automatic rotation missing');
          assert.ok(script.includes('data-hero-index'), 'Slide selection missing');
          assert.ok(script.includes('prefers-reduced-motion'), 'Motion accessibility missing');
          assert.ok(carousel.includes('weekBounds(today)'), 'Weekly priorities missing');
          const { selectHeroEvents }=await import('./src/hero-carousel.mjs');
          const highlights=selectHeroEvents(refs.events,[],'2026-11-10',6);
          assert.equal(highlights.length,6,'Need six featured event slides');
          assert.equal(highlights[0].id,'ref-camila-2026','First visual highlight should use a published poster');
          assert.ok(highlights.every(e=>e.posterUrl?.startsWith('https://')),'All slides must have HTTPS image sources');
          assert.ok(highlights.every(e=>e.id&&e.date&&e.venue),'Featured event incomplete');
          assert.ok(script.includes('hasHeroPoster(e,"reference")'),'Image-less reference cards must be hidden');
          assert.ok(!script.includes('heroBrokenIds'),'Remote image failures must not remove carousel slides');
          assert.ok(!script.includes('brokenReferenceImages'),'Remote image failures must not hide reference events');
          assert.ok(!script.includes('referenceCard.remove()'),'Remote poster errors must not delete event cards');
          assert.ok(script.includes('if(img.complete&&img.naturalWidth>0)loaded()'),
            'Lazy poster load must not be treated as a failure before error');
          assert.ok(script.includes('real.map(realCard).join("")'),
            'Reference cards must be rendered from event catalog');
          const shown=refs.events.filter(e=>(e.endDate||e.date)>='2026-11-11'
            &&hasHeroPoster(e,'reference')&&hasEventDescription(e));
          assert.equal(shown.length,6,'All six photographed reference events must be present');
          assert.ok(carousel.includes('hasHeroPoster(item,kind)'),'Hero image filter missing');
          assert.ok(refs.events.filter(e=>e.date>='2026-11-10'&&e.date<='2026-11-15').length>=16,'Verified weekly catalog must remain complete');
          const geoRegistry=JSON.parse(readFileSync('data/recintos-openstreetmap.json','utf8'));
          const {locateVenue,googleMapsEmbedUrl,googleMapsLocationUrl}=await import('./src/venue-geolocation.mjs');
          assert.ok(geoRegistry.venues.length>=11,'Venue coordinate catalog is incomplete');
          const mapped=refs.events.filter(e=>locateVenue(e,geoRegistry));
          assert.ok(mapped.length>=20,'Real event venue coverage has regressed');
          assert.ok(demo.events.every(e=>!locateVenue(e,geoRegistry)),
            'Never invent geographical pins for fictitious demo venues');
          const santander=locateVenue({venue:'Santander Arena',city:'Santiago'},geoRegistry);
          assert.ok(santander&&santander.lat===-33.46273,'Santander Arena point absent');
          assert.ok(googleMapsEmbedUrl(santander).startsWith('https://maps.google.com/maps?'));
          assert.ok(googleMapsLocationUrl(santander).startsWith('https://www.google.com/maps/search/?'));
          assert.ok(details.includes('id="venue-geolocation-map"'),'Google Maps venue container missing');
          assert.ok(details.includes('Abrir ubicación en Google Maps'),'Google Maps action missing');
          assert.ok(details.includes('colaboradores de OpenStreetMap'),'Coordinate-source attribution missing');
          assert.ok(detailJs.includes('renderGeolocation(event,reference,geoRegistry)'),'Geo map not loaded in event details');
          assert.ok(detailJs.includes('iframe.loading="lazy"'),'Google Maps iframe must load lazily');
          assert.ok(detailJs.includes('googleMapsEmbedUrl(venue,publicMapsKey)'),'Google Maps embedding missing');
          assert.ok(details.includes('name="google-maps-embed-key"'),'Optional official Embed API configuration missing');
          assert.ok(detailJs.includes('No mostraremos un marcador aproximado'),'Unverified venues need a safe placeholder');
          assert.ok(!readFileSync('src/venue-geolocation.mjs','utf8').includes('nominatim.openstreetmap.org'),
            'Do not geocode every page view through public Nominatim');
          console.log('Geolocated real event venues:',mapped.length,'of',refs.events.length);
          console.log('Featured event carousel, catalog and event detail pages validated.');
          JS
