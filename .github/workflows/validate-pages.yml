name: Validar cartelera pública PaseListo
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar módulos públicos
        run: |
          for module in src/*.mjs; do node --check "$module"; done
      - name: Comprobar catálogo vacío, navegación, imágenes y listas de espera
        run: node --test tests/pages-boot.test.mjs tests/poster-resilience.test.mjs tests/waiting-room.test.mjs tests/admin-event-controls.test.mjs
